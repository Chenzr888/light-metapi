name: upstream-balance

services:
  upstream-balance:
    image: ${UPSTREAM_BALANCE_IMAGE:?UPSTREAM_BALANCE_IMAGE is required}
    container_name: ${UPSTREAM_BALANCE_CONTAINER_NAME:-upstream-balance}
    user: "1000:1000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 192m
    memswap_limit: 768m
    pids_limit: 128
    env_file:
      - path: ${UPSTREAM_BALANCE_ENV_FILE:?UPSTREAM_BALANCE_ENV_FILE is required}
        required: true
    environment:
      HOST: 0.0.0.0
      PORT: 8756
      UPSTREAM_BALANCE_DATA_DIR: /app/data
      REFRESH_INTERVAL_SECONDS: 300
      ACCOUNT_REFRESH_ENABLED: "1"
      RECHARGE_ROUNDING_UNIT: 100
      NOTIFY_INTERVAL_SECONDS: 3600
      HISTORY_RETENTION_HOURS: 72
      LOW_BALANCE_ALERT_CNY: 100
      LOW_BALANCE_ALERT_COOLDOWN_SECONDS: 21600
      CHANNEL_ERROR_ALERT_COOLDOWN_SECONDS: 21600
      CATALOG_ACCOUNT_SYNC_INTERVAL_SECONDS: 3600
      UPSTREAM_REQUEST_TIMEOUT: 25
      SESSION_COOKIE_NAME: ub_admin_session
      SESSION_COOKIE_PATH: /upstream-balance
      SESSION_COOKIE_SECURE: "1"
    ports:
      - ${UPSTREAM_BALANCE_BIND:-127.0.0.1:8756}:8756
    volumes:
      - ${UPSTREAM_BALANCE_DATA_DIR:?UPSTREAM_BALANCE_DATA_DIR is required}:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8756/api/health', timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
