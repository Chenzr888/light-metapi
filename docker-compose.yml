services:
  upstream-balance:
    build: .
    container_name: upstream-balance
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8756
      REFRESH_INTERVAL_SECONDS: 30
      RECHARGE_ROUNDING_UNIT: 100
      NOTIFY_INTERVAL_SECONDS: 3600
      HISTORY_RETENTION_HOURS: 72
      LOW_BALANCE_ALERT_CNY: 100
      LOW_BALANCE_ALERT_COOLDOWN_SECONDS: 21600
      UPSTREAM_REQUEST_TIMEOUT: 25
      SESSION_COOKIE_NAME: ub_admin_session
      SESSION_COOKIE_PATH: /upstream-balance
      LOW_BALANCE_EMAIL_ENABLED: ${LOW_BALANCE_EMAIL_ENABLED:-0}
      LOW_BALANCE_EMAIL_RECIPIENTS: ${LOW_BALANCE_EMAIL_RECIPIENTS:-}
      LOW_BALANCE_EMAIL_FROM: ${LOW_BALANCE_EMAIL_FROM:-noreply@mail.sandboxai.top}
      LOW_BALANCE_EMAIL_SMTP_SERVER: ${LOW_BALANCE_EMAIL_SMTP_SERVER:-smtp.resend.com}
      LOW_BALANCE_EMAIL_SMTP_PORT: ${LOW_BALANCE_EMAIL_SMTP_PORT:-2587}
      LOW_BALANCE_EMAIL_SMTP_USER: ${LOW_BALANCE_EMAIL_SMTP_USER:-resend}
      LOW_BALANCE_EMAIL_SMTP_TOKEN: ${LOW_BALANCE_EMAIL_SMTP_TOKEN:-}
    ports:
      - "127.0.0.1:8756:8756"
    volumes:
      - ./data:/app/data
