name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: light-metapi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install --require-hashes --requirement requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-preview/package-lock.json

      - name: Install and audit frontend dependencies
        working-directory: ui-preview
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build frontend
        working-directory: ui-preview
        run: npm run build

      - name: Verify generated frontend is committed
        run: git diff --exit-code -- static/

      - name: Run backend and deploy-contract tests
        env:
          UPSTREAM_BALANCE_DATA_DIR: ${{ runner.temp }}/upstream-balance-tests
        run: python -m unittest discover -s tests -v

      - name: Validate production Compose
        env:
          UPSTREAM_BALANCE_IMAGE: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
          UPSTREAM_BALANCE_DATA_DIR: ${{ runner.temp }}/upstream-balance-data
          UPSTREAM_BALANCE_ENV_FILE: ${{ runner.temp }}/upstream-balance.env
        run: |
          mkdir -p "$UPSTREAM_BALANCE_DATA_DIR"
          touch "$UPSTREAM_BALANCE_ENV_FILE"
          for compose_file in deploy/docker-compose.cy16.yml deploy/docker-compose.rollback.yml; do
            resolved="${RUNNER_TEMP}/$(basename "$compose_file").json"
            docker compose -f "$compose_file" config --format json > "$resolved"
            python scripts/validate-compose-policy.py \
              "$resolved" "$UPSTREAM_BALANCE_IMAGE" "$UPSTREAM_BALANCE_DATA_DIR"
          done

      - name: Build immutable image
        env:
          IMAGE_REF: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "$IMAGE_REF" .

      - name: Smoke-test image
        env:
          IMAGE_REF: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          smoke_data="$(mktemp -d)"
          container="light-metapi-ci-${GITHUB_RUN_ID}"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run --rm --user 0:0 --entrypoint python \
              -e OWNER_UID="$runner_uid" -e OWNER_GID="$runner_gid" \
              -v "$smoke_data:/data" "$IMAGE_REF" -c '
          import os
          uid=int(os.environ["OWNER_UID"]); gid=int(os.environ["OWNER_GID"])
          for root, dirs, files in os.walk("/data"):
              os.chown(root, uid, gid); os.chmod(root, 0o700)
              for name in dirs:
                  os.chown(os.path.join(root, name), uid, gid)
              for name in files:
                  os.chown(os.path.join(root, name), uid, gid)
          ' >/dev/null 2>&1 || true
            find "$smoke_data" -depth -delete 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run --rm --user 0:0 --entrypoint python \
            -v "$smoke_data:/data" "$IMAGE_REF" \
            -c 'import os; os.chown("/data", 1000, 1000); os.chmod("/data", 0o700)'
          docker run -d --name "$container" \
            --user 1000:1000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e UPSTREAM_BALANCE_DATA_DIR=/app/data \
            -v "$smoke_data:/app/data" \
            -p 127.0.0.1:18756:8756 \
            "$IMAGE_REF" >/dev/null
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18756/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18756/api/health >/dev/null
          curl --fail --silent http://127.0.0.1:18756/_ub_api/auth/bootstrap >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18756/_ub_api/opencode/accounts)" = "401"

      - name: Export the tested image
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
        run: docker save "$IMAGE_REF" | gzip -1 > "${RUNNER_TEMP}/light-metapi-image.tar.gz"

      - name: Upload the tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: light-metapi-image-${{ github.sha }}
          path: ${{ runner.temp }}/light-metapi-image.tar.gz
          compression-level: 0
          retention-days: 7

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: light-metapi-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load and verify the tested image
        env:
          IMAGE_REF: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
        run: |
          docker load --input "${RUNNER_TEMP}/light-metapi-image.tar.gz"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact tested image
        env:
          IMAGE_REF: ghcr.io/chenzr888/light-metapi:sha-${{ github.sha }}
        run: docker push "$IMAGE_REF"
